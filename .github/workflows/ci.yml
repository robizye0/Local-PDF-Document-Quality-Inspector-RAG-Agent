name: CI/CD

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest flake8 black isort mypy

      - name: Lint with flake8
        if: matrix.python-version == '3.12'
        run: |
          cd backend
          flake8 --max-line-length=100 --exclude=__pycache__ .

      - name: Check formatting with black
        if: matrix.python-version == '3.12'
        run: |
          cd backend
          black --check --diff .

      - name: Check imports with isort
        if: matrix.python-version == '3.12'
        run: |
          cd backend
          isort --check-only --diff .

      - name: Type check with mypy
        if: matrix.python-version == '3.12'
        run: |
          cd backend
          mypy --ignore-missing-imports .

      - name: Run pytest
        run: |
          cd tests
          pytest -v --tb=short

      - name: Run deterministic RAG evaluation gate
        if: matrix.python-version == '3.12'
        run: |
          pytest tests/evals -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: speccheck-api:ci

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          tags: speccheck-frontend:ci

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security scanners
        run: pip install -r backend/requirements.txt pip-audit bandit

      - name: Audit Python dependencies
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt

      - name: Run Bandit static analysis
        continue-on-error: true
        run: bandit -r backend -x backend/__pycache__ -ll

      - name: Check for common credential patterns
        run: |
          ! git grep -n -I -E 'ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}' -- . ':!*.lock'
